<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetWorld — Reset Password</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🐾 PetWorld</div>
    <p class="auth-tagline">Reset Your Password</p>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <label for="user_id">User ID</label>
        <input type="text" id="user_id" required autocomplete="username">
        <p class="helper-text">The User ID you use to log in</p>
      </div>
      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="new_password" minlength="8" maxlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('new_password', this)">👁️</button>
        </div>
        <p class="helper-text">Must be exactly 8 characters</p>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="password-wrapper">
          <input type="password" id="confirm_password" minlength="8" maxlength="8" required autocomplete="new-password">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm_password', this)">👁️</button>
        </div>
      </div>
      <p class="error-text" id="reset-error"></p>
      <p class="success-text" id="reset-success"></p>
      <button type="submit" class="btn btn-primary btn-block" id="reset-btn">Reset Password</button>
    </form>

    <div class="auth-switch">
      <a href="index.html">Back to Login</a>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script><script src="js/api.js?v=7"></script>
<script>
  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("reset-error");
    const successEl = document.getElementById("reset-success");
    const btn = document.getElementById("reset-btn");
    errorEl.textContent = "";
    successEl.textContent = "";

    const user_id = document.getElementById("user_id").value.trim();
    const new_password = document.getElementById("new_password").value;
    const confirm_password = document.getElementById("confirm_password").value;

    if (!user_id) {
      errorEl.textContent = "Please enter your User ID.";
      return;
    }
    if (!new_password) {
      errorEl.textContent = "Please enter a new password.";
      return;
    }
    if (!confirm_password) {
      errorEl.textContent = "Please confirm your new password.";
      return;
    }
    if (new_password !== confirm_password) {
      errorEl.textContent = "Passwords do not match.";
      return;
    }
    if (new_password.length !== 8) {
      errorEl.textContent = "Password must be exactly 8 characters.";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Resetting...";

    try {
      const data = await api("/auth/reset-password", {
        method: "POST",
        auth: false,
        body: { user_id, new_password, confirm_password },
      });
      successEl.textContent = data.message || "Password reset successfully. Please login with your new password.";
      setTimeout(() => (window.location.href = "index.html"), 2000);
    } catch (err) {
      errorEl.textContent = err.message;
      btn.disabled = false;
      btn.textContent = "Reset Password";
    }
  });
</script>
</body>
</html>
