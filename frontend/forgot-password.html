<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetWorld — Forgot Password</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🐾 PetWorld</div>
    <p class="auth-tagline">Reset your password</p>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">Registered Email</label>
        <input type="email" id="email" required>
      </div>
      <p class="error-text" id="forgot-error"></p>
      <p class="success-text" id="forgot-success"></p>
      <button type="submit" class="btn btn-primary btn-block" id="forgot-btn">Send Reset Token</button>
    </form>

    <div class="auth-switch">
      Already have a token? <a href="reset-password.html">Reset password</a>
    </div>
    <div class="auth-switch">
      <a href="index.html">Back to Login</a>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script><script src="js/api.js?v=7"></script>
<script>
  document.getElementById("forgot-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("forgot-error");
    const successEl = document.getElementById("forgot-success");
    const btn = document.getElementById("forgot-btn");
    errorEl.textContent = "";
    successEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      const email = document.getElementById("email").value.trim();
      const data = await api("/auth/forgot-password", { method: "POST", auth: false, body: { email } });
      successEl.textContent = data.message + " Check your email (or the Flask console during local testing) for the reset token.";
      setTimeout(() => (window.location.href = "reset-password.html"), 2500);
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Send Reset Token";
    }
  });
</script>
</body>
</html>
