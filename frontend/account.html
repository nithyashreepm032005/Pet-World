<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetWorld — My Account</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header id="topbar"></header>

<main class="container">
  <div class="page-header">
    <div>
      <a href="home.html" class="back-link">← Back to Home</a>
      <h1>My Account</h1>
    </div>
  </div>

  <div class="account-layout">
    <aside class="account-sidebar">
      <div class="avatar" id="avatar-initial">P</div>
      <h3 id="sidebar-name">—</h3>
      <p id="sidebar-userid">—</p>
      <ul>
        <li><a class="active" href="account.html">👤 Profile</a></li>
        <li><a href="my-dogs.html">🐾 My Dogs</a></li>
        <li><a href="orders.html">📦 My Orders</a></li>
        <li><a href="bookings.html">🗓️ My Bookings</a></li>
        <li><a href="favourites.html">❤ My Favourites</a></li>
        <li><a href="cart.html">🛒 My Cart</a></li>
        <li><a href="#" id="logout-link">🚪 Logout</a></li>
      </ul>
    </aside>

    <section class="account-content">
      <h3 style="margin-bottom:18px;">Profile Details</h3>
      <form id="account-form">
        <div class="form-group"><label>User ID</label><input id="a-userid" disabled></div>
        <div class="form-group"><label>Full Name</label><input id="a-name" required></div>
        <div class="form-group"><label>Email</label><input id="a-email" disabled></div>
        <div class="form-group"><label>Phone</label><input id="a-phone" required></div>
        <div class="form-group"><label>Address</label><textarea id="a-address" rows="2" required></textarea></div>
        <p class="error-text" id="account-error"></p>
        <p class="success-text" id="account-success"></p>
        <button class="btn btn-primary" type="submit">Save Changes</button>
      </form>
    </section>
  </div>
</main>

<footer>🐾 PetWorld — Your information is private and secure.</footer>

<script src="js/api.js"></script>
<script src="js/account.js"></script>
</body>
</html>
