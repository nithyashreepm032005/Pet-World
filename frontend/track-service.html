<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetWorld — Track Employee</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/assistant.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  #map { height:400px; border-radius:16px; z-index:0; }
  .emoji-marker { font-size:32px; line-height:36px; text-align:center; background:none; border:none; }
  .panel { background:var(--card-bg); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:22px; }
  .employee-panel { margin-bottom:18px; }
  .employee-head { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .employee-head h3 { display:flex; align-items:center; gap:8px; }
  .employee-note { border-radius:14px; padding:12px 14px; margin-bottom:14px; font-size:14px; font-weight:600; background:#fff8e1; color:#8a6d00; }
  .employee-note.green { background:#e6f7ee; color:#1e8449; }
  .employee-note.error { background:#fdecea; color:var(--danger); }
  .employee-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 24px; }
  .employee-grid .detail-row:last-child { border-bottom:none; }
  .employee-status-badge { display:inline-block; padding:4px 11px; border-radius:20px; font-size:12px; font-weight:700; background:#fff3ea; color:var(--primary-dark); }
  .employee-status-badge.accepted { background:#d1ecf1; color:#0c5460; }
  .employee-status-badge.live { background:#cce5ff; color:#004085; }
  .employee-status-badge.done { background:#c3e6cb; color:#155724; }
  .employee-status-badge.missing { background:#eee; color:#666; }
  .steps { list-style:none; margin:6px 0 0; }
  .steps li { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:14px; color:var(--text-muted); }
  .steps li .dot { width:22px; height:22px; border-radius:50%; background:#eee; display:flex; align-items:center;
                   justify-content:center; font-size:12px; color:#fff; flex-shrink:0; }
  .steps li.done { color:var(--text-dark); }
  .steps li.done .dot { background:var(--success); }
  .steps li.current { color:var(--primary-dark); font-weight:700; }
  .steps li.current .dot { background:var(--primary); box-shadow:0 0 0 4px rgba(255,122,69,.25); }
  .detail-row { display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:6px 0; border-bottom:1px dashed #f0e4d8; }
  .detail-row span:first-child { color:var(--text-muted); }
  .detail-row span:last-child { font-weight:600; text-align:right; }
  .legend { font-size:13px; color:var(--text-muted); margin-top:10px; }
  .map-message { border-radius:14px; padding:16px; margin-top:0; background:#fff8e1; color:#8a6d00;
                 font-weight:600; font-size:14px; text-align:center; }
  @media (max-width: 620px) {
    #map { height:300px; }
    .employee-grid { grid-template-columns:1fr; }
    .panel { padding:18px; }
  }
</style>
</head>
<body>

<header id="topbar"></header>

<main class="container">
  <div class="page-header">
    <div>
      <a href="bookings.html" class="back-link" data-i18n="common.back_bookings">← My Bookings</a>
      <h1 data-i18n="track.title">Track Your Service 📍</h1>
    </div>
  </div>

  <div class="cart-layout" id="track-layout">
    <div>
      <div class="panel employee-panel">
        <div class="employee-head">
          <h3 data-i18n="track.employee_details">Employee Details</h3>
          <span class="employee-status-badge missing" id="employee-badge" data-i18n="common.loading">Loading…</span>
        </div>
        <div id="employee-details"><div class="spinner"></div></div>
      </div>
      <div class="panel">
        <div id="map"></div>
        <div id="map-message" class="map-message" style="display:none;"></div>
      </div>
    </div>

    <div>
      <div class="panel" style="margin-bottom:18px;">
        <h3 style="margin-bottom:10px;" data-i18n="track.booking_details">Booking Details</h3>
        <div id="details"></div>
      </div>
      <div class="panel">
        <h3 style="margin-bottom:6px;" data-i18n="track.status">Status</h3>
        <ul class="steps" id="steps"></ul>
      </div>
    </div>
  </div>
</main>

<footer data-i18n="track.footer">🐾 PetWorld — The map refreshes automatically every 5 seconds.</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/i18n.js"></script><script src="js/api.js?v=7"></script>
<script src="js/track-service.js?v=3"></script>
<script src="js/assistant.js"></script>
</body>
</html>
