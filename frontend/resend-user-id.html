<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetWorld — Forgot User ID</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">🐾 PetWorld</div>
    <p class="auth-tagline">Forgot your User ID?</p>

    <div class="payment-options" style="grid-template-columns: 1fr 1fr; margin-bottom:20px;">
      <button type="button" class="payment-option active" id="tab-phone" onclick="switchRecoveryTab('phone')">
        <span class="icon">📱</span><span class="label">By Phone</span>
      </button>
      <button type="button" class="payment-option" id="tab-email" onclick="switchRecoveryTab('email')">
        <span class="icon">✉️</span><span class="label">By Email</span>
      </button>
    </div>

    <!-- Phone recovery: looks up and shows the User ID directly -->
    <form id="phone-form">
      <div class="form-group">
        <label for="phone">Registered Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit number" required>
      </div>
      <p class="error-text" id="phone-error"></p>
      <p class="success-text" id="phone-success"></p>
      <button class="btn btn-primary btn-block" id="phone-btn" type="submit">Find My User ID</button>
    </form>

    <!-- Email recovery: sends the User ID to the registered email -->
    <form id="email-form" style="display:none;">
      <div class="form-group">
        <label for="email">Registered Email</label>
        <input type="email" id="email" required>
      </div>
      <p class="error-text" id="email-error"></p>
      <p class="success-text" id="email-success"></p>
      <button class="btn btn-primary btn-block" id="email-btn" type="submit">Email Me My User ID</button>
    </form>

    <div class="auth-switch">
      <a href="index.html">Back to Login</a>
    </div>
  </div>
</div>

<script src="js/api.js?v=5"></script>
<script>
  function switchRecoveryTab(tab) {
    document.getElementById("tab-phone").classList.toggle("active", tab === "phone");
    document.getElementById("tab-email").classList.toggle("active", tab === "email");
    document.getElementById("phone-form").style.display = tab === "phone" ? "block" : "none";
    document.getElementById("email-form").style.display = tab === "email" ? "block" : "none";
  }

  document.getElementById("phone-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("phone-error");
    const successEl = document.getElementById("phone-success");
    const btn = document.getElementById("phone-btn");
    errorEl.textContent = "";
    successEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Searching...";

    try {
      const phone = document.getElementById("phone").value.trim();
      const data = await api("/auth/forgot-user-id-by-phone", { method: "POST", auth: false, body: { phone } });
      successEl.textContent = `${data.message} Your User ID is: ${data.user_id}`;
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Find My User ID";
    }
  });

  document.getElementById("email-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("email-error");
    const successEl = document.getElementById("email-success");
    const btn = document.getElementById("email-btn");
    errorEl.textContent = "";
    successEl.textContent = "";
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
      const email = document.getElementById("email").value.trim();
      const data = await api("/auth/resend-user-id", { method: "POST", auth: false, body: { email } });
      successEl.textContent = data.message;
    } catch (err) {
      errorEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "Email Me My User ID";
    }
  });
</script>
</body>
</html>
